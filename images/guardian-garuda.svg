<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" role="img" aria-labelledby="title desc">
  <title id="title">Guardian Garuda</title>
  <desc id="desc">Stylized Beyblade artwork for Guardian Garuda.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" x2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="300" height="220" rx="18" fill="url(#bg)"/>
  <g transform="translate(150 110)">
    <circle r="60" fill="none" stroke="url(#ring)" stroke-width="14"/>
    <circle r="30" fill="#e2e8f0" opacity="0.12"/>
    <circle r="10" fill="#e2e8f0"/>
    <path d="M-60 0 L-32 0 M32 0 L60 0 M0 -60 L0 -32 M0 32 L0 60" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
  </g>
  <text x="150" y="186" text-anchor="middle" fill="#e2e8f0" font-size="18" font-family="Arial, sans-serif" font-weight="700">Guardian Garuda</text>
</svg>
